name: Frontend CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-home/package-lock.json

      - name: Install dependencies
        working-directory: react-home
        run: npm ci

      - name: Build frontend
        working-directory: react-home
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  deploy-check:
    needs: build
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Check deployment environment
        run: |
          echo "실행 사용자: $(whoami)"
          echo "현재 위치: $(pwd)"

          test -d /home/ubuntu/ballpark
          test -f /home/ubuntu/ballpark/docker-compose.yml

          docker --version
          docker compose version

          cd /home/ubuntu/ballpark
          docker compose config --services
          docker compose ps