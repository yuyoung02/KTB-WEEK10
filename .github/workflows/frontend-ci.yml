name: Frontend CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-home/package-lock.json

      - name: Install dependencies
        working-directory: react-home
        run: npm ci

      - name: Build frontend
        working-directory: react-home
        env:
          VITE_API_BASE_URL: /api
        run: npm run build