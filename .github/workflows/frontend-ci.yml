name: Frontend CI/CD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-home/package-lock.json

      - name: Install dependencies
        working-directory: react-home
        run: npm ci

      - name: Build frontend
        working-directory: react-home
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Update frontend source
        run: |
          cd /home/ubuntu/ballpark/KTB-WEEK10
          git pull origin main

      - name: Rebuild frontend container
        run: |
          cd /home/ubuntu/ballpark
          docker compose build frontend
          docker compose up -d --no-deps frontend

      - name: Check frontend container
        run: |
          cd /home/ubuntu/ballpark
          docker compose ps frontend
          curl --fail --silent http://localhost/ > /dev/null
          echo "Frontend deployment successful"